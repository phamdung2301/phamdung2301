<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Terminal: whoami — dunedev">
<defs>
<defs>
<filter id="glowMint" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowViolet" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="rgba(255,255,255,0.045)"/>
</pattern>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
<path d="M28 0H0V28" fill="none" stroke="rgba(0,245,212,0.22)" stroke-width="1"/>
</pattern>
</defs>
<style>
.ty-line{opacity:0;animation:ty-in .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes ty-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ty-cursor{animation:ty-blink 1.1s steps(1) infinite}
@keyframes ty-blink{50%{opacity:0}}
.ty-win{animation:ty-win 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ty-win{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.ty-glowpulse{animation:ty-glow 7s ease-in-out infinite alternate}
@keyframes ty-glow{from{opacity:.5}to{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ty-line{opacity:1}}
</style>
<linearGradient id="ty-sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="ty-winbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#150838" stop-opacity=".92"/><stop offset="1" stop-color="#0D0221" stop-opacity=".94"/>
</linearGradient>
<radialGradient id="ty-ambient" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#7209B7" stop-opacity=".4"/><stop offset="1" stop-color="#7209B7" stop-opacity="0"/>
</radialGradient>
<filter id="ty-glow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
  <feFlood flood-color="#00F5D4" flood-opacity=".75"/>
  <feComposite in2="b" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="ty-blur" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="26"/>
</filter>
</defs>
<rect width="1200" height="300" fill="#0D0221"/>
<ellipse class="ty-glowpulse" cx="600" cy="150" rx="470" ry="130" fill="url(#ty-ambient)" filter="url(#ty-blur)"/>
<g class="ty-win">
  <rect x="210" y="30" width="780" height="240" rx="14" fill="url(#ty-winbg)" stroke="#3A0CA3" stroke-opacity=".8" stroke-width="1.5"/>
  <rect x="210" y="30" width="780" height="240" rx="14" fill="url(#ty-sheen)"/>
  <line x1="224" y1="74" x2="976" y2="74" stroke="#3A0CA3" stroke-opacity=".6" stroke-width="1"/>
  <circle cx="242" cy="52" r="7" fill="#F72585" opacity=".9"/>
  <circle cx="266" cy="52" r="7" fill="#7209B7" opacity=".9"/>
  <circle cx="290" cy="52" r="7" fill="#00F5D4" opacity=".9"/>
  <text x="600" y="59" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace" font-size="15" fill="#8A8AA3" letter-spacing="1">dunedev@github:~</text>
  <text class="ty-line" x="250" y="88" font-family="ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace" font-size="19" style="--d:0.45s"><tspan fill="#F72585" font-weight="700">$</tspan><tspan fill="#00F5D4"> whoami</tspan></text><text class="ty-line" x="250" y="116" font-family="ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace" font-size="19" style="--d:1.35s"><tspan fill="#F72585" font-weight="700">dunedev</tspan><tspan fill="#E6E6FA"> — Junior Backend Developer</tspan></text><text class="ty-line" x="250" y="144" font-family="ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace" font-size="19" style="--d:2.25s"><tspan fill="#F72585" font-weight="700">$</tspan><tspan fill="#00F5D4"> cat stack.txt</tspan></text><text class="ty-line" x="250" y="172" font-family="ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace" font-size="19" style="--d:3.15s"><tspan fill="#E6E6FA">Java</tspan><tspan fill="#8A8AA3"> · </tspan><tspan fill="#E6E6FA">Spring Boot</tspan><tspan fill="#8A8AA3"> · </tspan><tspan fill="#E6E6FA">MongoDB</tspan><tspan fill="#8A8AA3"> · </tspan><tspan fill="#E6E6FA">React</tspan></text><text class="ty-line" x="250" y="200" font-family="ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace" font-size="19" style="--d:4.05s"><tspan fill="#F72585" font-weight="700">$</tspan><tspan fill="#00F5D4"> ./status --now</tspan></text><text class="ty-line" x="250" y="228" font-family="ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace" font-size="19" style="--d:4.95s"><tspan fill="#F72585" filter="url(#ty-glow)">●</tspan><tspan fill="#00F5D4" font-weight="700"> OPEN TO COLLABORATE</tspan></text><rect class="ty-cursor" x="550" y="213" width="11" height="19" fill="#00F5D4"/>
  <rect x="960" y="90" width="1.5" height="160" fill="#7209B7" opacity=".25"/>
</g>
</svg>