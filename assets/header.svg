<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="dunedev — Junior Backend Developer">
<defs>
<defs>
<filter id="glowMint" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowViolet" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="rgba(255,255,255,0.045)"/>
</pattern>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
<path d="M28 0H0V28" fill="none" stroke="rgba(0,245,212,0.22)" stroke-width="1"/>
</pattern>
</defs>
<style>
.hd-scene{animation:hd-enter 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes hd-enter{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.hd-drift{animation:hd-drift var(--dur,40s) cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes hd-drift{from{transform:translate(0,0)}to{transform:translate(var(--dx,10px),var(--dy,-46px))}}
.hd-twinkle{animation:hd-twinkle var(--dur2,6s) ease-in-out infinite alternate}
@keyframes hd-twinkle{from{opacity:var(--o0,.25)}to{opacity:var(--o1,.9)}}
.hd-scan{animation:hd-scan 9s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes hd-scan{0%{transform:translateY(-90px);opacity:0}12%{opacity:.5}88%{opacity:.5}100%{transform:translateY(430px);opacity:0}}
.hd-orb{animation:hd-orb 14s ease-in-out infinite alternate}
@keyframes hd-orb{from{transform:scale(1);opacity:var(--o0,.3)}to{transform:scale(1.12);opacity:var(--o1,.42)}}
.hd-blink{animation:hd-blink 1.6s steps(1) infinite}
@keyframes hd-blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hd-scan{display:none}}
</style>
<linearGradient id="hd-bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1B0535"/><stop offset=".55" stop-color="#0D0221"/><stop offset="1" stop-color="#070114"/>
</linearGradient>
<linearGradient id="hd-title" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#E6E6FA"/><stop offset=".55" stop-color="#BFFBF0"/><stop offset="1" stop-color="#00F5D4"/>
</linearGradient>
<linearGradient id="hd-scan" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/><stop offset=".5" stop-color="#00F5D4" stop-opacity=".55"/><stop offset="1" stop-color="#F72585" stop-opacity="0"/>
</linearGradient>
<radialGradient id="hd-orb-v" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#7209B7" stop-opacity=".55"/><stop offset="1" stop-color="#7209B7" stop-opacity="0"/>
</radialGradient>
<radialGradient id="hd-orb-p" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#F72585" stop-opacity=".5"/><stop offset="1" stop-color="#F72585" stop-opacity="0"/>
</radialGradient>
<radialGradient id="hd-orb-m" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#00F5D4" stop-opacity=".42"/><stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
</radialGradient>
<filter id="hd-glow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
  <feFlood flood-color="#00F5D4" flood-opacity=".8"/>
  <feComposite in2="b" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
