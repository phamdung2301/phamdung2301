<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="GitHub stats: 15 public repos, 4 featured builds, 2 years on GitHub, 7 core tech"><defs><style>
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.scanx{animation:scanx 3.4s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes scanx{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(986px);opacity:0}}
.scany{animation:scany 7s linear infinite}
@keyframes scany{from{transform:translateY(-90px)}to{transform:translateY(460px)}}
@media (prefers-reduced-motion:reduce){.rise,.blink,.scanx,.scany{animation:none}}
