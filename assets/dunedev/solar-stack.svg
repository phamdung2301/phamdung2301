<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" fill="none">
  <defs>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore">
      <stop offset="0" stop-color="#E6FFFB"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </radialGradient>
  </defs>

  <!-- quỹ đạo -->
  <circle cx="600" cy="230" r="90" stroke="#21262D" stroke-dasharray="3 7"/>
  <circle cx="600" cy="230" r="150" stroke="#21262D" stroke-dasharray="3 7"/>
  <circle cx="600" cy="230" r="210" stroke="#21262D" stroke-dasharray="3 7"/>

  <!-- mặt trời -->
  <circle cx="600" cy="230" r="60" fill="url(#sunGlow)">
    <animate attributeName="r" values="56;66;56" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="230" r="28" fill="url(#sunCore)"/>
  <text x="600" y="235" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#0D1117">dunedev</text>

  <!-- vành trong: backend core -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="200 600 230" to="560 600 230" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(690,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-200" to="-560" dur="16s" repeatCount="indefinite"/>
      <circle r="17" fill="#E76F00" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Jv</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="20 600 230" to="380 600 230" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(690,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-20" to="-380" dur="16s" repeatCount="indefinite"/>
      <circle r="17" fill="#6DB33F" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Sb</text>
    </g></g>
  </g>

  <!-- vành giữa: data & tools (quay ngược) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 600 230" to="-180 600 230" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(750,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-180" to="180" dur="26s" repeatCount="indefinite"/>
      <circle r="17" fill="#00758F" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">My</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="270 600 230" to="-90 600 230" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(750,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-270" to="90" dur="26s" repeatCount="indefinite"/>
      <circle r="17" fill="#336791" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Pg</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 230" to="-360 600 230" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(750,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <circle r="17" fill="#2496ED" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Dk</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="90 600 230" to="-270 600 230" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(750,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="26s" repeatCount="indefinite"/>
      <circle r="17" fill="#F05032" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Gt</text>
    </g></g>
  </g>

  <!-- vành ngoài: web (quay xuôi) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="150 600 230" to="510 600 230" dur="38s" repeatCount="indefinite"/>
    <g transform="translate(810,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-150" to="-510" dur="38s" repeatCount="indefinite"/>
      <circle r="17" fill="#E44D26" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Ht</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="210 600 230" to="570 600 230" dur="38s" repeatCount="indefinite"/>
    <g transform="translate(810,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-210" to="-570" dur="38s" repeatCount="indefinite"/>
      <circle r="17" fill="#1572B6" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Cs</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="330 600 230" to="690 600 230" dur="38s" repeatCount="indefinite"/>
    <g transform="translate(810,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-330" to="-690" dur="38s" repeatCount="indefinite"/>
      <circle r="17" fill="#F0DB4F" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#0D1117">Js</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="30 600 230" to="390 600 230" dur="38s" repeatCount="indefinite"/>
    <g transform="translate(810,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-30" to="-390" dur="38s" repeatCount="indefinite"/>
      <circle r="17" fill="#61DAFB" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#0D1117">Re</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="60 600 230" to="420 600 230" dur="38s" repeatCount="indefinite"/>
    <g transform="translate(810,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-60" to="-420" dur="38s" repeatCount="indefinite"/>
      <circle r="17" fill="#3178C6" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Ts</text>
    </g></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 600 230" to="480 600 230" dur="38s" repeatCount="indefinite"/>
    <g transform="translate(810,230)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-120" to="-480" dur="38s" repeatCount="indefinite"/>
      <circle r="17" fill="#3776AB" stroke="#0D1117" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" fill="#FFFFFF">Py</text>
    </g></g>
  </g>
</svg>
