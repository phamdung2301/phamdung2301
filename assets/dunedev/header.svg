<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <g id="cm">
      <polygon points="0,-11 22,0 0,11 -22,0" fill="#00F5D4"/>
      <polygon points="-22,0 0,11 0,31 -22,20" fill="#0C9F8A"/>
      <polygon points="0,11 22,0 22,20 0,31" fill="#077263"/>
    </g>
    <g id="cv">
      <polygon points="0,-11 22,0 0,11 -22,0" fill="#A78BFA"/>
      <polygon points="-22,0 0,11 0,31 -22,20" fill="#7C3AED"/>
      <polygon points="0,11 22,0 22,20 0,31" fill="#5B21B6"/>
