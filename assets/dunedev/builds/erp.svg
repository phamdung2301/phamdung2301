<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 300" fill="none">
  <defs>
    <clipPath id="cardErp"><rect width="590" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#cardErp)">
    <rect width="590" height="300" fill="#0D1117"/>
    <rect width="590" height="34" fill="#10151C"/>
    <circle cx="22" cy="17" r="5" fill="#21262D"/>
    <circle cx="38" cy="17" r="5" fill="#21262D"/>
    <circle cx="54" cy="17" r="5" fill="#21262D"/>
    <text x="70" y="21" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#8B949E">github.com/phamdung2301/erp</text>

    <rect y="34" width="590" height="212" fill="#0D1117"/>
    <text x="40" y="80" font-family="ui-monospace,Consolas,monospace" font-size="22" font-weight="700" fill="#E6E6FA">ERP SUITE</text>
    <text x="40" y="98" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="2" fill="#00F5D4">JAVA · SPRING BOOT · MYSQL</text>

    <rect x="40" y="116" width="150" height="46" rx="8" fill="#161B22" stroke="#21262D"/>
    <text x="52" y="136" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8B949E">MODULES</text>
    <text x="52" y="154" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" fill="#00F5D4">12</text>
    <rect x="210" y="116" width="150" height="46" rx="8" fill="#161B22" stroke="#21262D"/>
    <text x="222" y="136" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8B949E">REST ENDPOINTS</text>
    <text x="222" y="154" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" fill="#00F5D4">64</text>
    <rect x="380" y="116" width="150" height="46" rx="8" fill="#161B22" stroke="#21262D"/>
    <text x="392" y="136" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8B949E">ROLE-BASED AUTH</text>
    <text x="392" y="154" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" fill="#00F5D4">RBAC</text>

    <!-- cột biểu đồ nhấp nhô -->
    <rect x="44" y="190" width="26" height="40" fill="#00F5D4" opacity="0.75">
      <animate attributeName="height" values="40;86;52;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="190;144;178;190" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="170" width="26" height="60" fill="#00F5D4" opacity="0.55">
      <animate attributeName="height" values="60;34;72;60" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="170;196;158;170" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="148" y="200" width="26" height="30" fill="#8B5CF6" opacity="0.85">
      <animate attributeName="height" values="30;64;44;30" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;166;186;200" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="182" width="26" height="48" fill="#00F5D4" opacity="0.65">
      <animate attributeName="height" values="48;78;38;48" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="182;152;192;182" dur="3s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="252" y="194" width="26" height="36" fill="#00F5D4" opacity="0.45">
      <animate attributeName="height" values="36;58;26;36" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="194;172;204;194" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <line x1="40" y1="230" x2="290" y2="230" stroke="#21262D"/>

    <!-- đường.line chart vẽ đi vẽ lại -->
    <polyline points="380,210 410,190 440,198 470,168 500,178 530,150 560,158" stroke="#8B5CF6" stroke-width="2.5" fill="none" pathLength="100" stroke-dasharray="100">
      <animate attributeName="stroke-dashoffset" values="100;0;100" dur="6s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="560" cy="158" r="3.5" fill="#00F5D4"/>
    <line x1="380" y1="230" x2="560" y2="230" stroke="#21262D"/>

    <rect y="246" width="590" height="54" fill="#10151C"/>
    <text x="30" y="272" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" fill="#00F5D4">erp</text>
    <text x="30" y="290" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#8B949E">Java · Spring Boot · MySQL — backend quản trị doanh nghiệp</text>
    <text x="560" y="278" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#E6E6FA">open ↗</text>
  </g>
  <rect width="589" height="299" x="0.5" y="0.5" rx="14" stroke="#2A2E37"/>
</svg>
