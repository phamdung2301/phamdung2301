<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 300" fill="none">
  <defs>
    <clipPath id="cardMoc"><rect width="590" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#cardMoc)">
    <rect width="590" height="300" fill="#14100A"/>
    <rect width="590" height="34" fill="#1A1410"/>
    <circle cx="22" cy="17" r="5" fill="#3A2E1E"/>
    <circle cx="38" cy="17" r="5" fill="#3A2E1E"/>
    <circle cx="54" cy="17" r="5" fill="#3A2E1E"/>
