<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 300" fill="none">
  <defs>
    <clipPath id="card"><rect width="590" height="300" rx="14"/></clipPath>
    <clipPath id="lensL"><circle cx="258" cy="150" r="32"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="590" height="300" fill="#F5F4EF"/>
    <rect width="590" height="34" fill="#EDEBE3"/>
    <circle cx="22" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="38" cy="17" r="5" fill="#FEBC2E"/>
    <circle cx="54" cy="17" r="5" fill="#28C840"/>
    <text x="70" y="21" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#8A8574">github.com/phamdung2301/eyewear_art</text>

    <rect y="34" width="590" height="212" fill="#F2F0EA"/>
    <text x="40" y="88" font-family="ui-monospace,Consolas,monospace" font-size="26" font-weight="700" fill="#1B1B18">LUNET®</text>
    <text x="40" y="108" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="3" fill="#6D6A5F">ATELIER QUANG HỌC</text>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 300 150;2 300 150;-2 300 150" dur="6s" repeatCount="indefinite"/>
      <circle cx="258" cy="150" r="32" fill="#CFE0E8" opacity="0.55" stroke="#1B1B18" stroke-width="3"/>
      <circle cx="342" cy="150" r="32" fill="#CFE0E8" opacity="0.55" stroke="#1B1B18" stroke-width="3"/>
      <path d="M290 148 Q300 138 310 148" stroke="#1B1B18" stroke-width="3" fill="none"/>
      <line x1="226" y1="146" x2="200" y2="136" stroke="#1B1B18" stroke-width="3"/>
      <line x1="374" y1="146" x2="400" y2="136" stroke="#1B1B18" stroke-width="3"/>
    </g>
    <g clip-path="url(#lensL)">
      <rect x="230" y="100" width="8" height="100" fill="#FFFFFF" opacity="0.55" transform="rotate(20 234 150)">
        <animateTransform attributeName="transform" type="translate" values="-90 0;70 0" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <circle cx="285" cy="225" r="7" fill="#8B5A2B">
      <animate attributeName="fill" values="#8B5A2B;#D9D9D9;#1B1B18;#8B5A2B" dur="4.5s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="305" cy="225" r="7" fill="#D9D9D9">
      <animate attributeName="fill" values="#D9D9D9;#1B1B18;#8B5A2B;#D9D9D9" dur="4.5s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="325" cy="225" r="7" fill="#1B1B18">
      <animate attributeName="fill" values="#1B1B18;#8B5A2B;#D9D9D9;#1B1B18" dur="4.5s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="230" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#6D6A5F">Frame Lab — 2.490.000₫</text>

    <rect y="246" width="590" height="54" fill="#0D1117"/>
    <text x="30" y="272" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" fill="#00F5D4">eyewear_art</text>
    <text x="30" y="290" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#8B949E">React · TypeScript · Three.js — kính 3D + Frame Lab</text>
    <text x="560" y="278" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#E6E6FA">open ↗</text>
  </g>
  <rect width="589" height="299" x="0.5" y="0.5" rx="14" stroke="#2A2E37"/>
</svg>
