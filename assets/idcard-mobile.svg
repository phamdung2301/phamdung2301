  <polygon points="370.2,244.0 320.0,273.0 269.8,244.0 269.8,186.0 320.0,157.0 370.2,186.0" fill="url(#idc-hexfill)" stroke="#7209B7" stroke-width="2.5" filter="url(#idc-glowV)"/>
  <polygon points="359.0,237.5 320.0,260.0 281.0,237.5 281.0,192.5 320.0,170.0 359.0,192.5" fill="none" stroke="#00F5D4" stroke-width="1.5" opacity="0.55"/>
  <text x="320" y="215" text-anchor="middle" dominant-baseline="central" class="d" font-size="53" letter-spacing="2" fill="#E6E6FA">DV</text>
