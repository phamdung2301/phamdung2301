<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img">
<title>dunedev — operator ID card</title>
<defs>
<defs>
<filter id="glowMint" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowViolet" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="rgba(255,255,255,0.045)"/>
</pattern>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
<path d="M28 0H0V28" fill="none" stroke="rgba(0,245,212,0.22)" stroke-width="1"/>
</pattern>
</defs>
<radialGradient id="idc-hexfill" cx="50%" cy="38%" r="75%">
  <stop offset="0%" stop-color="#241159"/>
  <stop offset="60%" stop-color="#120A33"/>
  <stop offset="100%" stop-color="#0E0628"/>
</radialGradient>
<linearGradient id="idc-holo" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#7209B7" stop-opacity="0"/>
  <stop offset="42%" stop-color="#7209B7" stop-opacity="0.38"/>
  <stop offset="58%" stop-color="#00F5D4" stop-opacity="0.30"/>
  <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
</linearGradient>
<linearGradient id="idc-sheen" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#7209B7" stop-opacity="0.16"/>
  <stop offset="45%" stop-color="#7209B7" stop-opacity="0"/>
  <stop offset="100%" stop-color="#F72585" stop-opacity="0.08"/>
</linearGradient>
<filter id="idc-glowV" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
  <feFlood flood-color="#7209B7" flood-opacity="0.9"/>
  <feComposite in2="b" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="idc-glowM" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
  <feFlood flood-color="#00F5D4" flood-opacity="0.9"/>
  <feComposite in2="b" operator="in" result="g"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="idc-dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.4" fill="#7209B7" opacity="0.5"/>
</pattern>
</defs>
<style>
.f{font-family:ui-monospace,'Cascadia Code','Fira Code',Menlo,Consolas,monospace}
.d{font-family:system-ui,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
