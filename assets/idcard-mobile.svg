  <text x="512" y="85" text-anchor="middle" class="f" font-size="14" fill="#E6E6FA">ID: DV-2026</text>
</g>
<line x1="64" y1="110" x2="576" y2="110" stroke="#3A0CA3" stroke-width="1" opacity="0.6"/>

