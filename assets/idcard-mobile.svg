<path d="M596 650 H626 V620" fill="none" stroke="#00F5D4" stroke-width="4" stroke-linecap="square" filter="url(#idc-glowM)" opacity="0.9"/>
<g clip-path="url(#idc-cardclip-m)">
  <g transform="translate(320,0) skewX(-18)">
